[build-system]
requires = ["setuptools >= 68.0", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "mreg-api"
description = "MREG API"
readme = "README.md"
maintainers = [{ name = "Peder Hovdan Andresen", email = "pederhan@uio.no" }]
authors = [{ name = "Terje Kvernes", email = "terjekv@uio.no" }]

requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["mreg", "api"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx[socks]>=0.28.1",
    "typing-extensions>=4.16.0",
    "pydantic>=2.12",
    "pydantic-extra-types>=2.1.0",
    "diskcache>=5.6.3",
    "pydantic-settings>=2.12.0",
]
dynamic = ["version"]


[project.urls]
Repository = 'https://github.com/unioslo/mreg-api/'

[dependency-groups]
dev = [
    "pytest",
    "inline-snapshot",
    "pytest-httpserver",
    "ruff",
    "setuptools",
    "setuptools-scm",
    "build",
    "basedpyright>=1.39.8",
    "pytest-cov>=7.0.0",
    "pytest-timeout",
    { include-group = "docs" },
]
docs = ["zensical>=0.0.46", "mkdocstrings-python>=2.0.5"]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires live mreg server (set MREG_URL env var or --mreg-url)",
    "readonly: test only reads data, safe against staging/production servers",
]

[tool.coverage.run]
source = ["mreg_api"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.setuptools.packages.find]
include = ["mreg_api*"]

[tool.black]
max-line-length = 99

[tool.inline-snapshot]
format-command = "ruff check --fix-only --stdin-filename {filename} | ruff format --stdin-filename {filename}"

[tool.isort]
profile = "black"
line_length = 99

[tool.ruff]
line-length = 110
# Assume Python 3.11.
target-version = "py311"

[tool.ruff.lint.isort]
# Force one line per import to simplify diffing and merging
force-single-line = true
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint]
extend-select = [
    "A", # flake8-builtins
    # "ANN", # annotations
    "ARG", # flake8-unused-arguments
    "B",   # flake8-bugbear
    "D",   # pydocstyle
    "DJ",  # flake8-django
    "E",   # error
    "F",   # Pyflakes
    "I",   # isort
    "ISC", # flake8-implicit-str-concat
    "INP", # flake8-no-pep420 (implicit namespace packages, you need __init__.py)
    #    "PL", # pylint (all of the below)
    "PLC", # pylint-convention
    "PLE", # pylint-error
    # "PLR", # pylint-refactor
    # "PLW", # pylint-warning
    "UP", # pyupgrade
    "W",  # warnings
]
ignore = [
    # B905 (`zip()` without an explicit `strict=` parameter) is incompatible with older python versions.
    "B905",
    # D203 (1 blank line required before class docstring) is incompatible with
    # D211 (No blank lines allowed before class docstring). We ignore D203.
    "D203",
    # D213 (Multi-line docstring summary should start at the second line) is incompatible with
    # D212 (Multi-line docstring summary should start at the first line). We ignore D213.
    "D213",

    # Rules disabled due to using ruff as a formatter. Most of these rules
    # will thus be enforced by the formatter.
    # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",    # Indentation contains tabs
    "E111",    # Indentation is not a multiple of four
    "E114",    # Indentation is not a multiple of four (comment)
    "E117",    # Over-indented
    "D206",    # Docstring should be indented with spaces, not tabs
    "D300",    # Use """triple double quotes""" (found '''-quotes)
    "Q000",    # Remove bad quotes (inlined)
    "Q001",    # Remove bad quotes (multiline)
    "Q002",    # Remove bad quotes (docstring)
    "Q003",    # Avoidable escape quote
    "COM812",  # Missing trailing comma in Python 3.6+
    "COM819",  # Prohibited trailing comma
    "ISC001",  # Implicit string concatenation (single line)
    "ISC002",  # Implicit string concatenation (multiline)
    "PLC0415", # Imports from package are not at the top of the file
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = [
    "A",
    "B",
    "C",
    "D",
    "E",
    "F",
    "G",
    "I",
    "N",
    "Q",
    "S",
    "T",
    "W",
    "ANN",
    "ARG",
    "BLE",
    "COM",
    "DJ",
    "DTZ",
    "EM",
    "ERA",
    "EXE",
    "FBT",
    "ICN",
    "INP",
    "ISC",
    "NPY",
    "PD",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "SLF",
    "TCH",
    "TID",
    "TRY",
    "UP",
    "YTT",
]
unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "migrations",
]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/{tests,docs,tools}/*" = ["D103", "E501", "D100", "D104", "ARG001"]
"ci/*" = ["D103", "D104", "INP001"]


[tool.setuptools_scm]
version_file = "mreg_api/_version.py"

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "recommended"
reportUnannotatedClassAttribute = "hint"
reportUnusedCallResult = "hint"
reportImplicitOverride = "hint"
reportImportCycles = "hint"

# Multiple inheritance is not an error per se. In order to implement a
# clean API with type safety for read/write managers, as well as specialized
# managers for resources with name-based lookups, we need to use multiple
# inheritance in some places.
# There is ONE thing we need to ensure: Only the base `ResourceManager` class
# can define an __init__ method.
reportUnsafeMultipleInheritance = false
reportMissingSuperCall = "hint"

# When working with pydantic before-validators, we have no choice
# but to use and interact with `Any`-typed values.
reportExplicitAny = false
reportAny = false
